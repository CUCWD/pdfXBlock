name: Python CI

on:
  push:
    branches: [master, 'develop/ulmo.master']
  pull_request:
    branches:
    - '**'

permissions:
  contents: read

jobs:
  run_tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']
        toxenv: [django42, django52, quality, eslint]

    steps:
    - uses: actions/checkout@v4
    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm

    - name: Install pip
      run: pip install -r requirements/pip.txt

    - name: Install Dependencies
      run: make requirements_ci

    - name: Run Tests
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: tox
