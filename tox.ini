[tox]
envlist = eslint,py{311,312}-django{42,52},quality

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
deps =
    django42: Django>=4.2,<4.3
    django52: Django==5.2.11
    -r{toxinidir}/requirements/test.txt
commands =
    coverage run --source=pdf -m unittest discover -s tests -v {posargs}
    coverage report
    coverage html

[testenv:clean]
commands =
    coverage erase
deps =
    -c{toxinidir}/requirements/ulmo-constraints.txt
    coverage
skip_install = True

; PDF has no standalone CSS files, so Qualtrics' csslint environment is omitted.
[testenv:eslint]
allowlist_externals =
    make
    {toxinidir}/node_modules/eslint/bin/eslint.js
commands =
    make requirements_js
    {toxinidir}/node_modules/eslint/bin/eslint.js pdf/static/js/
deps =
skip_install = True

[testenv:quality]
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements/quality.txt
commands =
    pycodestyle pdf tests setup.py test_settings.py
    isort --check-only --diff pdf tests setup.py test_settings.py
skip_install = True

; No Transifex project is configured for PDF, so there is no push environment.
[testenv:ulmo]
description = Alias for standalone tests against Ulmo's Django version
deps =
    Django==5.2.11
    -r{toxinidir}/requirements/test.txt

[pycodestyle]
exclude = .git,.tox
max-line-length = 120

[isort]
line_length = 120
